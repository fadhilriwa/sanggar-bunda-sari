<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pembayaran - Sanggar Bunda Sari</title>
    <meta name="description" content="Halaman konfirmasi status pembayaran biaya pendaftaran siswa Sanggar Bunda Sari">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        :root {
            --status-success: #10b981;
            --status-pending: #f59e0b;
            --status-failed:  #ef4444;
            --status-expired: #6b7280;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* ---- Status Card ---- */
        .status-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        }

        .status-card {
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- Status Icon ---- */
        .status-icon-wrap {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            position: relative;
        }

        .status-icon-wrap.success {
            background: rgba(16,185,129,0.12);
            color: var(--status-success);
            box-shadow: 0 0 0 12px rgba(16,185,129,0.08);
        }
        .status-icon-wrap.pending {
            background: rgba(245,158,11,0.12);
            color: var(--status-pending);
            box-shadow: 0 0 0 12px rgba(245,158,11,0.08);
        }
        .status-icon-wrap.failed {
            background: rgba(239,68,68,0.12);
            color: var(--status-failed);
            box-shadow: 0 0 0 12px rgba(239,68,68,0.08);
        }
        .status-icon-wrap.expired {
            background: rgba(107,114,128,0.12);
            color: var(--status-expired);
            box-shadow: 0 0 0 12px rgba(107,114,128,0.08);
        }

        /* Animasi checkmark */
        .icon-success { animation: popIn 0.4s 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        /* Animasi spinner pending */
        .icon-pending { animation: spin 2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Detail Rows ---- */
        .detail-table { width: 100%; }
        .detail-table tr td:first-child {
            color: #64748b;
            font-size: 0.85rem;
            padding: 0.4rem 0;
            width: 45%;
        }
        .detail-table tr td:last-child {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.9rem;
            text-align: right;
            padding: 0.4rem 0;
        }

        /* ---- Status Badge ---- */
        .badge-status {
            display: inline-block;
            padding: 0.35em 0.85em;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .badge-success { background:#d1fae5; color:#065f46; }
        .badge-pending { background:#fef3c7; color:#92400e; }
        .badge-failed  { background:#fee2e2; color:#991b1b; }
        .badge-expired { background:#f3f4f6; color:#374151; }

        /* ---- Progress Steps ---- */
        .steps { display:flex; gap:0; margin: 1.5rem 0; }
        .step  { flex:1; text-align:center; position:relative; }
        .step::before {
            content:'';
            position:absolute;
            top:16px; left:50%;
            width:100%; height:2px;
            background:#e2e8f0;
            z-index:0;
        }
        .step:last-child::before { display:none; }
        .step-dot {
            width:32px; height:32px; border-radius:50%;
            display:inline-flex; align-items:center; justify-content:center;
            background:#e2e8f0; color:#94a3b8;
            font-size:0.75rem; font-weight:700;
            position:relative; z-index:1;
            margin-bottom:4px;
        }
        .step.done .step-dot   { background:#10b981; color:#fff; }
        .step.active .step-dot { background:#3b82f6; color:#fff; animation: pulseDot 1.5s ease-in-out infinite; }
        .step-label { font-size:0.7rem; color:#64748b; display:block; }
        @keyframes pulseDot {
            0%,100% { box-shadow:0 0 0 0 rgba(59,130,246,0.4); }
            50%      { box-shadow:0 0 0 8px rgba(59,130,246,0); }
        }

        /* ---- Polling Indicator ---- */
        .polling-bar {
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
            animation: progressLoop 2s ease-in-out infinite;
            margin-top: 0.75rem;
        }
        @keyframes progressLoop {
            0%   { width:0%; margin-left:0; }
            50%  { width:70%; margin-left:15%; }
            100% { width:0%; margin-left:100%; }
        }

        /* ---- Buttons ---- */
        .btn-home    { background: linear-gradient(135deg,#3b82f6,#6366f1); color:#fff; border:none; }
        .btn-home:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,0.35); color:#fff; }
        .btn-retry   { background:transparent; border:2px solid #ef4444; color:#ef4444; }
        .btn-retry:hover { background:#ef4444; color:#fff; }
        .btn-wa      { background:#25d366; color:#fff; border:none; }
        .btn-wa:hover { background:#1da851; color:#fff; }
        .btn-action  { border-radius:12px; padding:0.65rem 1.4rem; font-weight:600; transition:all 0.25s; }

        /* ---- Loading Skeleton ---- */
        .skeleton { animation:shimmer 1.5s infinite linear; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size:200% 100%; border-radius:6px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ---- Copy Button ---- */
        .copy-btn { cursor:pointer; transition:color 0.2s; }
        .copy-btn:hover { color:#3b82f6; }
    </style>
</head>
<body>
    <div class="status-wrapper">
        <div class="status-card" id="statusCard">

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-3">
                <div class="skeleton mb-3" style="height:96px;width:96px;border-radius:50%;margin:0 auto"></div>
                <div class="skeleton mb-2" style="height:28px;width:60%;margin:0 auto"></div>
                <div class="skeleton mb-4" style="height:16px;width:80%;margin:0 auto"></div>
                <div class="skeleton" style="height:180px;border-radius:12px"></div>
            </div>

            <!-- Actual Content (hidden until loaded) -->
            <div id="statusContent" style="display:none">

                <!-- Icon -->
                <div class="text-center mb-3">
                    <div class="status-icon-wrap" id="statusIconWrap">
                        <i id="statusIcon"></i>
                    </div>
                    <h2 class="fw-bold mb-1" id="statusTitle">Memproses...</h2>
                    <p class="text-muted small mb-0" id="statusSubtitle"></p>
                </div>

                <!-- Progress Steps -->
                <div class="steps" id="stepsContainer">
                    <div class="step done" id="step1">
                        <div class="step-dot"><i class="bi bi-check"></i></div>
                        <span class="step-label">Formulir</span>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-dot">2</div>
                        <span class="step-label">Pembayaran</span>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-dot">3</div>
                        <span class="step-label">Konfirmasi</span>
                    </div>
                </div>

                <!-- Detail Table -->
                <div class="p-3 rounded-3 mb-3" id="detailBox" style="background:#f8fafc; border:1px solid #e2e8f0;">
                    <table class="detail-table">
                        <tr>
                            <td>Nomor Pesanan</td>
                            <td id="detailOrderId">—
                                <i class="bi bi-copy ms-1 copy-btn" onclick="copyText('detailOrderId')" title="Salin"></i>
                            </td>
                        </tr>
                        <tr>
                            <td>Nama Siswa</td>
                            <td id="detailName">—</td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td id="detailEmail" style="word-break:break-all">—</td>
                        </tr>
                        <tr>
                            <td>Total Bayar</td>
                            <td id="detailAmount" class="text-primary fw-bold" style="font-size:1.05rem">—</td>
                        </tr>
                        <tr>
                            <td>Metode Bayar</td>
                            <td id="detailPayType">—</td>
                        </tr>
                        <tr>
                            <td>Waktu Bayar</td>
                            <td id="detailPaidAt">—</td>
                        </tr>
                        <tr>
                            <td>Status</td>
                            <td id="detailStatus"><span class="badge-status badge-pending">Menunggu</span></td>
                        </tr>
                    </table>
                </div>

                <!-- Polling bar (hanya muncul jika pending) -->
                <div id="pollingContainer" style="display:none">
                    <p class="text-center text-muted small mb-1">Menunggu konfirmasi pembayaran...</p>
                    <div class="polling-bar"></div>
                </div>

                <!-- Action Buttons -->
                <div class="d-grid gap-2 mt-3" id="actionButtons">
                    <!-- Isi oleh JS -->
                </div>

            </div>
            <!-- /statusContent -->

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // =====================================================
    // Halaman Status Pembayaran
    // =====================================================

    const API_BASE = '..'; // relatif ke folder templates/
    let pollingTimer = null;
    let pollingCount = 0;
    const MAX_POLLING = 20; // max 20 kali cek (tiap 5 detik = 100 detik)

    // ---- Parse URL Params ----
    const params   = new URLSearchParams(location.search);
    const urlStatus = params.get('status');     // success / pending / failed
    const orderId   = params.get('order_id');
    const regNo     = params.get('registration_no') || sessionStorage.getItem('registration_no');

    // ---- Render Berdasarkan Data ----
    function renderStatus(data) {
        document.getElementById('loadingState').style.display  = 'none';
        document.getElementById('statusContent').style.display = 'block';

        const status      = data.status || urlStatus || 'pending';
        const iconWrap    = document.getElementById('statusIconWrap');
        const iconEl      = document.getElementById('statusIcon');
        const title       = document.getElementById('statusTitle');
        const subtitle    = document.getElementById('statusSubtitle');
        const step2       = document.getElementById('step2');
        const step3       = document.getElementById('step3');
        const actionBtns  = document.getElementById('actionButtons');
        const pollingBox  = document.getElementById('pollingContainer');

        const configs = {
            success: {
                iconClass: 'bi bi-check-circle-fill icon-success',
                wrapClass: 'success',
                title:    'Pembayaran Berhasil! 🎉',
                subtitle: 'Terima kasih! Pendaftaran Anda telah dikonfirmasi.',
                step2cls: 'done', step3cls: 'done',
                badge: '<span class="badge-status badge-success">Lunas</span>',
            },
            pending: {
                iconClass: 'bi bi-hourglass-split icon-pending',
                wrapClass: 'pending',
                title:    'Menunggu Pembayaran',
                subtitle: 'Selesaikan pembayaran Anda. Halaman ini akan diperbarui otomatis.',
                step2cls: 'active', step3cls: '',
                badge: '<span class="badge-status badge-pending">Pending</span>',
            },
            failed: {
                iconClass: 'bi bi-x-circle-fill',
                wrapClass: 'failed',
                title:    'Pembayaran Gagal',
                subtitle: 'Transaksi tidak berhasil. Silakan coba lagi.',
                step2cls: '', step3cls: '',
                badge: '<span class="badge-status badge-failed">Gagal</span>',
            },
            expired: {
                iconClass: 'bi bi-clock-history',
                wrapClass: 'expired',
                title:    'Transaksi Kedaluwarsa',
                subtitle: 'Waktu pembayaran habis. Silakan daftar ulang.',
                step2cls: '', step3cls: '',
                badge: '<span class="badge-status badge-expired">Expired</span>',
            },
        };

        const cfg = configs[status] || configs['pending'];

        iconWrap.className = 'status-icon-wrap ' + cfg.wrapClass;
        iconEl.className   = cfg.iconClass;
        title.textContent  = cfg.title;
        subtitle.textContent = cfg.subtitle;
        step2.className    = 'step ' + cfg.step2cls;
        step3.className    = 'step ' + cfg.step3cls;
        if (cfg.step2cls === 'done') step2.querySelector('.step-dot').innerHTML = '<i class="bi bi-check"></i>';
        if (cfg.step3cls === 'done') step3.querySelector('.step-dot').innerHTML = '<i class="bi bi-check"></i>';

        // Detail
        const oid = data.midtrans_order_id || orderId || '—';
        document.getElementById('detailOrderId').innerHTML =
            oid + ' <i class="bi bi-copy ms-1 copy-btn" onclick="copyText(\'oid_val\')" title="Salin"></i>';
        window['oid_val'] = oid; // trik copy
        document.getElementById('detailName').textContent    = data.student_name || '—';
        document.getElementById('detailEmail').textContent   = data.student_email || '—';
        document.getElementById('detailAmount').textContent  = data.amount
            ? 'Rp ' + Number(data.amount).toLocaleString('id-ID') : '—';
        document.getElementById('detailPayType').textContent = formatPayType(data.payment_type || '—');
        document.getElementById('detailPaidAt').textContent  = data.paid_at
            ? formatDate(data.paid_at) : (status === 'success' ? 'Baru saja' : '—');
        document.getElementById('detailStatus').innerHTML    = cfg.badge;

        // Polling indicator
        if (status === 'pending') {
            pollingBox.style.display = 'block';
            startPolling();
        } else {
            pollingBox.style.display = 'none';
            stopPolling();
        }

        // Tombol aksi
        actionBtns.innerHTML = buildButtons(status, data);
    }

    function buildButtons(status, data) {
        const dashUrl     = './dashboard.html';
        const registerUrl = './register.html';
        const waUrl       = 'https://wa.me/6287780074616?text=' +
            encodeURIComponent('Halo, saya sudah melakukan pembayaran pendaftaran. Order ID: ' + (data.midtrans_order_id || orderId || ''));

        if (status === 'success') {
            return `
                <a href="${dashUrl}" class="btn btn-home btn-action">
                    <i class="bi bi-house-fill me-2"></i>Ke Dashboard
                </a>
                <a href="${waUrl}" target="_blank" class="btn btn-wa btn-action">
                    <i class="bi bi-whatsapp me-2"></i>Konfirmasi via WhatsApp
                </a>`;
        }
        if (status === 'pending') {
            return `
                <button onclick="checkStatusNow()" class="btn btn-primary btn-action">
                    <i class="bi bi-arrow-clockwise me-2"></i>Refresh Status
                </button>
                <a href="${waUrl}" target="_blank" class="btn btn-wa btn-action">
                    <i class="bi bi-whatsapp me-2"></i>Hubungi Kami
                </a>`;
        }
        // failed / expired
        return `
            <a href="${registerUrl}" class="btn btn-retry btn-action">
                <i class="bi bi-arrow-repeat me-2"></i>Coba Daftar Ulang
            </a>
            <a href="${dashUrl}" class="btn btn-outline-secondary btn-action">
                <i class="bi bi-house me-2"></i>Ke Dashboard
            </a>`;
    }

    // ---- Format Helpers ----
    function formatPayType(type) {
        const map = {
            bank_transfer: 'Transfer Bank',
            gopay: 'GoPay',
            shopeepay: 'ShopeePay',
            qris: 'QRIS',
            credit_card: 'Kartu Kredit',
            bca_klikpay: 'BCA KlikPay',
            echannel: 'Mandiri Bill',
            permata: 'Permata',
            cstore: 'Alfamart / Indomaret',
        };
        return map[type] || (type !== '—' ? type : 'Belum dipilih');
    }

    function formatDate(dtStr) {
        if (!dtStr) return '—';
        const d = new Date(dtStr.replace(' ', 'T'));
        return d.toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' });
    }

    // ---- Copy to Clipboard ----
    window.copyText = function(elId) {
        const val = window[elId] || document.getElementById(elId)?.innerText || '';
        navigator.clipboard.writeText(val.replace(/\s/g,'').replace(/[^\w\-]/g,'')).then(() => {
            alert('Disalin: ' + val);
        }).catch(() => {});
    };

    // ---- Polling (cek status tiap 5 detik) ----
    function startPolling() {
        if (pollingTimer) return;
        pollingTimer = setInterval(async () => {
            pollingCount++;
            if (pollingCount > MAX_POLLING) {
                stopPolling();
                return;
            }
            await checkStatusNow(true); // silent mode
        }, 5000);
    }

    function stopPolling() {
        if (pollingTimer) {
            clearInterval(pollingTimer);
            pollingTimer = null;
        }
    }

    window.checkStatusNow = async function(silent = false) {
        const searchParam = orderId
            ? `order_id=${encodeURIComponent(orderId)}`
            : regNo
                ? `registration_no=${encodeURIComponent(regNo)}`
                : null;

        if (!searchParam) {
            if (!silent) alert('Tidak ada nomor pesanan untuk dicek.');
            return;
        }

        try {
            const res  = await fetch(`${API_BASE}/php/api/midtrans_check_status.php?${searchParam}`);
            const json = await res.json();
            if (json.success && json.data) {
                renderStatus(json.data);
                // Hentikan polling jika sudah final
                if (['success','failed','expired'].includes(json.data.status)) {
                    stopPolling();
                }
            }
        } catch (e) {
            if (!silent) console.error('Gagal cek status:', e);
        }
    };

    // =====================================================
    // INISIALISASI
    // =====================================================
    async function init() {
        // Jika ada order_id atau regNo, ambil dari API
        if (orderId || regNo) {
            await checkStatusNow(true);
            // Jika berhasil, sudah di-render oleh checkStatusNow
            // Jika gagal (misal DB kosong), render dari URL param
            setTimeout(() => {
                if (document.getElementById('loadingState').style.display !== 'none') {
                    renderStatus({ status: urlStatus || 'pending' });
                }
            }, 3000);
        } else {
            // Tidak ada param — tampilkan berdasarkan urlStatus
            renderStatus({ status: urlStatus || 'pending' });
        }
    }

    init();
    </script>
</body>
</html>
